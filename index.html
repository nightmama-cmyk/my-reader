<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲端閱讀器 (全格式+AI+自訂排版)</title>
    <!-- 引入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap');
        body { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
        .content-area { line-height: 1.9; letter-spacing: 0.03em; word-break: break-all; user-select: text; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type=range] { accent-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .progress-bar { transition: width 0.4s ease-in-out; }
        .ai-bubble { position: relative; border-radius: 1.2rem; border-bottom-left-radius: 0.2rem; }
        .ai-bubble-user { border-radius: 1.2rem; border-bottom-right-radius: 0.2rem; }
        .icon-wrapper { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
        
        /* 字體支援 */
        .font-sans-tc { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        .font-kai-tc { font-family: 'DFKai-SB', 'BiauKai', 'Kaiti TC', 'STKaiti', serif; }
        
        /* 直排模式支援 */
        .vertical-rl { writing-mode: vertical-rl; }
        .horizontal-tb { writing-mode: horizontal-tb; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        // --- Gemini API 呼叫函數 ---
        async function fetchGemini(prompt, apiKey, systemInstruction = "") {
            if (!apiKey) throw new Error("API_KEY_MISSING");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，無法回答。";
                } catch (error) {
                    if (error.message === "API_KEY_MISSING") throw error;
                    if (i === 4) throw error;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        // 穩定的圖標組件
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px;height:${size}px"></i>`;
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="icon-wrapper"></span>;
        };

        const App = () => {
            // --- 核心狀態 ---
            const [books, setBooks] = useState([]);
            const [currentBookId, setCurrentBookId] = useState(null);
            
            // 彈窗開關
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isAIOpen, setIsAIOpen] = useState(false);
            
            // 閱讀設定
            const [theme, setTheme] = useState('light');
            const [fontSize, setFontSize] = useState(20);
            const [fontFamily, setFontFamily] = useState('serif'); // sans, serif, kai
            const [convMode, setConvMode] = useState('none');      // none, s2t, t2s
            const [marginSize, setMarginSize] = useState(20);      // 0 到 40，每步 5
            const [textDirection, setTextDirection] = useState('horizontal'); // horizontal, vertical
            
            // 安全設定與 OCR
            const [geminiApiKey, setGeminiApiKey] = useState("");
            const [tempApiKey, setTempApiKey] = useState("");
            const [ocrLang, setOcrLang] = useState('eng');         // eng, chi_tra, chi_sim
            const [forceOcr, setForceOcr] = useState(false);       // 強制 OCR 開關

            // 系統狀態
            const [isLoading, setIsLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [ocrProgress, setOcrProgress] = useState(0);

            // AI 聊天
            const [chatHistory, setChatHistory] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isAILoading, setIsAILoading] = useState(false);

            // --- 持久化儲存 ---
            useEffect(() => {
                const savedBooks = localStorage.getItem('ebook_lib_v11') || localStorage.getItem('ebook_lib_v10');
                const savedSettings = localStorage.getItem('ebook_set_v11') || localStorage.getItem('ebook_set_v10');
                
                if (savedBooks) {
                    try { setBooks(JSON.parse(savedBooks)); } catch(e) {}
                }
                if (savedSettings) {
                    try {
                        const s = JSON.parse(savedSettings);
                        if (s.theme) setTheme(s.theme);
                        if (s.fontSize) setFontSize(s.fontSize);
                        if (s.fontFamily) setFontFamily(s.fontFamily);
                        if (s.convMode) setConvMode(s.convMode);
                        if (s.marginSize !== undefined) setMarginSize(s.marginSize);
                        else if (s.marginMode === 'narrow') setMarginSize(5);
                        else if (s.marginMode === 'medium') setMarginSize(15);
                        else if (s.marginMode === 'wide') setMarginSize(25);
                        if (s.textDirection) setTextDirection(s.textDirection);
                        if (s.ocrLang) setOcrLang(s.ocrLang);
                        if (s.forceOcr !== undefined) setForceOcr(s.forceOcr);
                        if (s.geminiApiKey) { setGeminiApiKey(s.geminiApiKey); setTempApiKey(s.geminiApiKey); }
                        if (s.currentBookId) setCurrentBookId(s.currentBookId);
                    } catch(e) {}
                }
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }, []);

            useEffect(() => {
                localStorage.setItem('ebook_set_v11', JSON.stringify({ 
                    theme, fontSize, fontFamily, convMode, marginSize, textDirection, ocrLang, forceOcr, geminiApiKey, currentBookId 
                }));
            }, [theme, fontSize, fontFamily, convMode, marginSize, textDirection, ocrLang, forceOcr, geminiApiKey, currentBookId]);

            useEffect(() => {
                localStorage.setItem('ebook_lib_v11', JSON.stringify(books));
            }, [books]);

            const currentBook = useMemo(() => books.find(b => b.id === currentBookId), [books, currentBookId]);

            // --- 繁簡轉換邏輯 ---
            const convertText = (text) => {
                if (!text || convMode === 'none' || !window.OpenCC) return text;
                try {
                    const config = convMode === 's2t' ? { from: 'cn', to: 'hk' } : { from: 'hk', to: 'cn' };
                    const converter = window.OpenCC.Converter(config);
                    return converter(text);
                } catch (e) { return text; }
            };

            const displayContent = useMemo(() => convertText(currentBook?.content), [currentBook, convMode]);
            const displayTitle = useMemo(() => convertText(currentBook?.title), [currentBook, convMode]);

            // --- 樣式計算 ---
            const getLayoutClass = () => {
                let base = "flex-1 no-scrollbar scroll-smooth ";
                if (textDirection === 'vertical') {
                    // 直排模式：左右滾動，使用 inline style 控制上下 padding
                    base += "vertical-rl overflow-x-auto overflow-y-hidden px-6 ";
                } else {
                    // 橫排模式：上下滾動，使用 inline style 控制左右 padding
                    base += "horizontal-tb overflow-y-auto overflow-x-hidden py-6 ";
                }
                return base;
            };

            const getFontFamilyStyle = () => {
                if (fontFamily === 'serif') return '"Noto Serif TC", serif';
                if (fontFamily === 'kai') return '"DFKai-SB", "BiauKai", "Kaiti TC", "STKaiti", serif';
                return '"Noto Sans TC", sans-serif'; 
            };

            // --- 滾動進度處理 ---
            const handleScroll = (e) => {
                if (!currentBookId) return;
                const { scrollTop, scrollHeight, clientHeight, scrollLeft, scrollWidth, clientWidth } = e.currentTarget;
                let prog = 0;
                
                if (textDirection === 'vertical') {
                    if (scrollWidth <= clientWidth) return;
                    // 直排時，向左滾動 (數值可能為負)
                    prog = (Math.abs(scrollLeft) / (scrollWidth - clientWidth)) * 100;
                } else {
                    if (scrollHeight <= clientHeight) return;
                    prog = (scrollTop / (scrollHeight - clientHeight)) * 100;
                }
                
                setBooks(prev => prev.map(b => b.id === currentBookId ? { ...b, progress: prog } : b));
            };

            // --- 檔案導入 ---
            const handleFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                setOcrProgress(0);
                setLoadingMsg("正在解析檔案...");
                
                try {
                    const fileName = file.name.toLowerCase();
                    if (fileName.endsWith('.txt')) {
                        const r = new FileReader();
                        r.onload = (ev) => importBook(file.name, ev.target.result);
                        r.readAsText(file);
                    } else if (fileName.endsWith('.docx')) {
                        const r = new FileReader();
                        r.onload = async (ev) => {
                            const res = await window.mammoth.extractRawText({ arrayBuffer: ev.target.result });
                            importBook(file.name, res.value);
                        };
                        r.readAsArrayBuffer(file);
                    } else if (fileName.endsWith('.epub')) {
                        const zip = await JSZip.loadAsync(file);
                        let epubText = "";
                        const files = Object.keys(zip.files).filter(f => f.endsWith('.html') || f.endsWith('.xhtml'));
                        for (let fName of files) {
                            const content = await zip.file(fName).async("string");
                            const doc = new DOMParser().parseFromString(content, 'text/html');
                            epubText += doc.body.innerText + "\n\n";
                        }
                        importBook(file.name, epubText);
                    } else if (fileName.endsWith('.pdf')) {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        
                        if (forceOcr) {
                            await runOCR(pdf, file.name, ocrLang);
                        } else {
                            let fullText = "";
                            let hasTextLayer = 0;
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const tc = await page.getTextContent();
                                const pt = tc.items.map(it => it.str).join(" ");
                                if (pt.trim().length > 15) hasTextLayer++;
                                fullText += pt + "\n";
                            }

                            if (hasTextLayer < Math.min(pdf.numPages, 2)) {
                                if (confirm(`系統偵測此為「圖片型 PDF」。\n是否啟動 OCR 進行文字提取？\n(語言: ${ocrLang})`)) {
                                    await runOCR(pdf, file.name, ocrLang);
                                } else { 
                                    importBook(file.name, ""); 
                                }
                            } else {
                                importBook(file.name, fullText);
                            }
                        }
                    } else {
                        alert("不支援的格式。請使用 TXT, DOCX, EPUB 或 PDF。");
                        setIsLoading(false);
                    }
                } catch (err) { alert("出錯了：" + err.message); setIsLoading(false); }
                
                e.target.value = null; // 允許重覆選取
            };

            const runOCR = async (pdf, title, lang) => {
                setLoadingMsg("正在初始化 OCR 引擎...");
                const worker = await Tesseract.createWorker(lang);
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    setOcrProgress(Math.round((i / pdf.numPages) * 100));
                    setLoadingMsg(`正在進行 OCR 辨識 (${i}/${pdf.numPages} 頁)...`);
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    const { data: { text: res } } = await worker.recognize(canvas);
                    text += res + "\n";
                }
                await worker.terminate();
                importBook(title, text);
            };

            const importBook = (title, content) => {
                const nb = { id: Date.now().toString(), title: title.replace(/\.[^/.]+$/, ""), content: content || "（無內容）", progress: 0 };
                setBooks(prev => [nb, ...prev]);
                setCurrentBookId(nb.id);
                setIsMenuOpen(false);
                setIsLoading(false);
            };

            // --- AI 助手 ---
            const handleAISummary = async () => {
                if (!currentBook) return;
                setIsAILoading(true);
                setChatHistory(prev => [...prev, { role: "user", text: "請總結此內容。" }]);
                try {
                    const res = await fetchGemini(`書名：${currentBook.title}\n內容：${currentBook.content.substring(0, 8000)}\n請總結大意。`, geminiApiKey, "你是文學助手。請用繁體回答。");
                    setChatHistory(prev => [...prev, { role: "ai", text: res }]);
                } catch(e) {
                    setChatHistory(prev => [...prev, { role: "ai", text: e.message === "API_KEY_MISSING" ? "請先在設定或此處輸入您的 API Key。" : "系統錯誤或連線中斷。" }]);
                }
                setIsAILoading(false);
            };

            const handleAskAI = async () => {
                if (!userInput.trim() || !currentBook) return;
                const q = userInput; setUserInput("");
                setChatHistory(prev => [...prev, { role: "user", text: q }]);
                setIsAILoading(true);
                try {
                    const res = await fetchGemini(`書名：${currentBook.title}\n背景：${currentBook.content.substring(0, 10000)}\n問題：${q}`, geminiApiKey, "你是導師。請用繁體回答。");
                    setChatHistory(prev => [...prev, { role: "ai", text: res }]);
                } catch(e) {
                    setChatHistory(prev => [...prev, { role: "ai", text: e.message === "API_KEY_MISSING" ? "請先在設定或此處輸入您的 API Key。" : "系統錯誤或連線中斷。" }]);
                }
                setIsAILoading(false);
            };

            const saveApiKeyFromChat = () => {
                if (tempApiKey.trim()) {
                    setGeminiApiKey(tempApiKey.trim());
                    alert("API Key 已儲存！");
                }
            };

            const themes = {
                light: 'bg-white text-slate-800',
                dark: 'bg-slate-900 text-slate-300',
                sepia: 'bg-[#f4ecd8] text-[#5b4636]',
                grey: 'bg-zinc-800 text-zinc-300'
            };

            return (
                <div className={`flex flex-col h-screen transition-colors duration-300 ${themes[theme]}`}>
                    {/* Header */}
                    <header className={`flex items-center justify-between px-4 py-3 border-b border-opacity-10 border-current shadow-sm z-30 ${themes[theme]}`}>
                        <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-black hover:bg-opacity-5 rounded-full flex items-center justify-center">
                            <Icon name="menu" size={24} />
                        </button>
                        <h1 className="font-bold text-base truncate flex-1 text-center px-4 tracking-wider">
                            {currentBook ? displayTitle : '雲端閱讀器'}
                        </h1>
                        <div className="flex gap-1 items-center">
                            <button onClick={() => setIsAIOpen(true)} className="p-2 text-blue-500 active:scale-90 flex items-center justify-center">
                                <Icon name="sparkles" size={24} />
                            </button>
                            <button onClick={() => setIsSettingsOpen(true)} className="p-2 hover:bg-black hover:bg-opacity-5 rounded-full flex items-center justify-center">
                                <Icon name="settings" size={24} />
                            </button>
                        </div>
                    </header>

                    {/* Content */}
                    <main onScroll={handleScroll} className={getLayoutClass()}
                        style={{ 
                            fontSize: `${fontSize}pt`, 
                            fontFamily: getFontFamilyStyle(),
                            paddingLeft: textDirection === 'horizontal' ? `${marginSize}%` : undefined,
                            paddingRight: textDirection === 'horizontal' ? `${marginSize}%` : undefined,
                            paddingTop: textDirection === 'vertical' ? `${marginSize}%` : undefined,
                            paddingBottom: textDirection === 'vertical' ? `${marginSize}%` : undefined
                        }}>
                        {currentBook ? (
                            <div className="content-area whitespace-pre-wrap fade-in">
                                <h2 className="text-2xl font-bold mb-8 opacity-80 border-b border-current border-opacity-10 pb-4">{displayTitle}</h2>
                                {displayContent}
                                <div className="h-48 w-48" />
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-full opacity-40 text-center p-10 horizontal-tb">
                                <Icon name="book-open" size={80} className="mb-4" />
                                <p className="text-lg font-bold tracking-widest mb-2">請打開左側書庫</p>
                                <p className="text-xs italic leading-relaxed">完美支援 EPUB / PDF / DOCX / TXT<br/>內置 OCR 提取與 AI 閱讀助手</p>
                            </div>
                        )}
                    </main>

                    {currentBook && (
                        <div className="h-1.5 w-full bg-gray-500 bg-opacity-10 fixed bottom-0 z-40">
                            <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${currentBook.progress}%` }} />
                        </div>
                    )}

                    {/* Drawer: Library & OCR Settings */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div className="bg-white dark:bg-slate-800 w-80 h-full shadow-2xl flex flex-col animate-in slide-in-from-left duration-300">
                                <div className="p-5 bg-blue-600 text-white flex justify-between items-center">
                                    <span className="font-bold flex items-center gap-2"><Icon name="library" size={20} /> 我的書庫</span>
                                    <button onClick={() => setIsMenuOpen(false)}><Icon name="x" size={24} /></button>
                                </div>
                                
                                {/* OCR Settings & Import */}
                                <div className="p-4 border-b dark:border-slate-700 bg-blue-50/50 dark:bg-slate-800/50">
                                    <div className="flex items-center gap-2 mb-3 text-blue-600 dark:text-blue-400 font-bold text-sm">
                                        <Icon name="scan-text" size={16} /> PDF OCR 設定
                                    </div>
                                    <div className="mb-3 grid grid-cols-3 gap-2">
                                        <button onClick={() => setOcrLang('eng')} className={`py-1 text-xs rounded-lg transition-all ${ocrLang === 'eng' ? 'bg-blue-500 text-white font-bold shadow' : 'bg-white dark:bg-slate-700 border dark:border-slate-600 opacity-70'}`}>英文</button>
                                        <button onClick={() => setOcrLang('chi_tra')} className={`py-1 text-xs rounded-lg transition-all ${ocrLang === 'chi_tra' ? 'bg-blue-500 text-white font-bold shadow' : 'bg-white dark:bg-slate-700 border dark:border-slate-600 opacity-70'}`}>繁中</button>
                                        <button onClick={() => setOcrLang('chi_sim')} className={`py-1 text-xs rounded-lg transition-all ${ocrLang === 'chi_sim' ? 'bg-blue-500 text-white font-bold shadow' : 'bg-white dark:bg-slate-700 border dark:border-slate-600 opacity-70'}`}>簡中</button>
                                    </div>
                                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer mb-4">
                                        <input type="checkbox" checked={forceOcr} onChange={e => setForceOcr(e.target.checked)} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" />
                                        強制對所有 PDF 使用 OCR 提取
                                    </label>

                                    <label className="flex flex-col items-center justify-center p-4 border-2 border-dashed border-blue-300 dark:border-slate-500 rounded-2xl cursor-pointer hover:bg-blue-100 dark:hover:bg-slate-600 transition-all text-blue-600 dark:text-blue-400 group">
                                        <Icon name="plus-circle" size={28} className="group-active:scale-95" />
                                        <span className="mt-2 text-sm font-bold tracking-wider">導入新書</span>
                                        <input type="file" className="hidden" accept=".txt,.docx,.pdf,.epub" onChange={handleFile} />
                                    </label>
                                </div>

                                {/* Book List */}
                                <div className="flex-1 overflow-y-auto no-scrollbar">
                                    {books.map(b => (
                                        <div key={b.id} onClick={() => {setCurrentBookId(b.id); setIsMenuOpen(false);}}
                                            className={`px-5 py-4 border-b dark:border-slate-700 flex justify-between items-center cursor-pointer active:bg-blue-50 transition-colors ${currentBookId === b.id ? 'bg-blue-50 dark:bg-slate-700/50 text-blue-600 font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-gray-50 dark:hover:bg-slate-800'}`}>
                                            <span className="truncate flex-1 text-sm">{convertText(b.title)}</span>
                                            <button onClick={(e) => { e.stopPropagation(); setBooks(books.filter(x=>x.id!==b.id)); }} className="text-red-400 p-2 ml-2 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-full">
                                                <Icon name="trash-2" size={18} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex-1 bg-black bg-opacity-50 backdrop-blur-sm transition-opacity" onClick={() => setIsMenuOpen(false)} />
                        </div>
                    )}

                    {/* ✨ AI Assistant */}
                    {isAIOpen && (
                        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-lg h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-300">
                                <div className="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-gradient-to-r from-blue-500 to-indigo-600 text-white">
                                    <h3 className="font-bold flex items-center gap-2"><Icon name="sparkles" size={20} /> ✨ AI 閱讀助手</h3>
                                    <button onClick={() => setIsAIOpen(false)} className="p-1 hover:bg-white hover:bg-opacity-20 rounded-full flex items-center justify-center"><Icon name="x" size={24} /></button>
                                </div>
                                
                                {!geminiApiKey ? (
                                    <div className="flex flex-col items-center justify-center h-full px-8 text-center space-y-4 bg-slate-50 dark:bg-slate-900 dark:text-white">
                                        <Icon name="key" size={48} className="text-blue-500 mb-2" />
                                        <h4 className="font-bold text-lg">設定 API 金鑰</h4>
                                        <p className="text-xs opacity-70 leading-relaxed">為了保護隱私與安全，本程式不內建金鑰。<br/>請輸入您的 Google Gemini API Key 以啟用 AI 助手。</p>
                                        <input
                                            type="password"
                                            value={tempApiKey}
                                            onChange={e => setTempApiKey(e.target.value)}
                                            placeholder="輸入 API Key..."
                                            className="w-full bg-gray-200 dark:bg-slate-700 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white"
                                        />
                                        <button
                                            onClick={saveApiKeyFromChat}
                                            className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition-all"
                                        >
                                            儲存並啟用
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 dark:bg-slate-900 no-scrollbar">
                                            {chatHistory.length === 0 && (
                                                <div className="flex flex-col items-center justify-center h-full opacity-40 text-center px-4">
                                                    <Icon name="message-circle" size={48} className="mb-4 text-blue-500" />
                                                    <p className="text-sm font-bold">我可以幫您分析這本書</p>
                                                    <div className="mt-6 grid grid-cols-2 gap-2 w-full px-4">
                                                        <button onClick={handleAISummary} className="p-3 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl text-xs font-bold text-blue-600 flex items-center justify-center gap-2 active:scale-95 transition-all"><Icon name="file-text" size={14} /> 內容總結</button>
                                                        <button onClick={() => setUserInput("列出書中的重點人物與知識點。")} className="p-3 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl text-xs font-bold text-blue-600 flex items-center justify-center gap-2 active:scale-95 transition-all"><Icon name="list" size={14} /> 重點提取</button>
                                                    </div>
                                                </div>
                                            )}
                                            {chatHistory.map((chat, i) => (
                                                <div key={i} className={`flex ${chat.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[85%] px-4 py-3 shadow-sm ${chat.role === 'user' ? 'bg-blue-600 text-white ai-bubble-user' : 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 ai-bubble'}`}>
                                                        <p className="text-sm whitespace-pre-wrap leading-relaxed font-sans">{chat.text}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {isAILoading && (
                                                <div className="flex justify-start">
                                                    <div className="bg-white dark:bg-slate-700 px-4 py-3 rounded-2xl animate-pulse flex items-center gap-1.5">
                                                        <div className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce"></div>
                                                        <div className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></div>
                                                        <div className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style={{animationDelay:'0.4s'}}></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="p-4 border-t dark:border-slate-700 flex gap-2 items-center bg-white dark:bg-slate-800">
                                            <input type="text" value={userInput} onChange={(e) => setUserInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleAskAI()} placeholder="✨ 詢問 AI..." className="flex-1 bg-gray-100 dark:bg-slate-700 border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white" />
                                            <button onClick={handleAskAI} disabled={isAILoading || !userInput.trim()} className="w-12 h-12 flex items-center justify-center bg-blue-600 text-white rounded-full shadow-lg disabled:opacity-50 active:scale-95 transition-transform"><Icon name="send" size={18} /></button>
                                        </div>
                                    </>
                                )}
                            </div>
                            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-[2px] -z-10" onClick={() => setIsAIOpen(false)} />
                        </div>
                    )}

                    {/* Modal: Settings */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-md max-h-[90vh] overflow-y-auto no-scrollbar rounded-3xl shadow-2xl p-6 space-y-6 animate-in slide-in-from-bottom sm:zoom-in duration-200">
                                <div className="flex justify-between items-center border-b pb-3 dark:border-slate-700">
                                    <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="settings" size={20} /> 綜合設定</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="p-1 bg-gray-100 dark:bg-slate-700 rounded-full flex items-center justify-center"><Icon name="x" size={20} /></button>
                                </div>
                                
                                {/* 1. 字體轉換模式 (雙向繁簡) */}
                                <div className="space-y-2">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>字體轉換模式</span></div>
                                    <div className="grid grid-cols-3 gap-2 bg-gray-50 dark:bg-slate-700 p-1.5 rounded-2xl">
                                        <button onClick={() => setConvMode('none')} className={`py-2.5 text-xs rounded-xl transition-all ${convMode === 'none' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-slate-800 dark:text-white' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>原始內容</button>
                                        <button onClick={() => setConvMode('s2t')} className={`py-2.5 text-xs rounded-xl transition-all ${convMode === 's2t' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>強制繁體</button>
                                        <button onClick={() => setConvMode('t2s')} className={`py-2.5 text-xs rounded-xl transition-all ${convMode === 't2s' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>強制簡體</button>
                                    </div>
                                </div>

                                {/* 2. 排版方向 (直排/橫排) */}
                                <div className="space-y-2">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>排版方向</span></div>
                                    <div className="grid grid-cols-2 gap-2 bg-gray-50 dark:bg-slate-700 p-1.5 rounded-2xl">
                                        <button onClick={() => setTextDirection('horizontal')} className={`py-2.5 text-xs rounded-xl transition-all ${textDirection === 'horizontal' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>橫排 (由左至右)</button>
                                        <button onClick={() => setTextDirection('vertical')} className={`py-2.5 text-xs rounded-xl transition-all ${textDirection === 'vertical' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>直排 (由右至左)</button>
                                    </div>
                                </div>

                                {/* 3. 螢幕留白比例 (Slider) */}
                                <div className="space-y-3">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>螢幕留白比例</span><span className="text-blue-500 text-base">{marginSize}%</span></div>
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-slate-700 p-3 rounded-2xl">
                                        <button onClick={() => setMarginSize(f => Math.max(0, f-5))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="minus" size={16} /></button>
                                        <input type="range" min="0" max="40" step="5" value={marginSize} onChange={e => setMarginSize(parseInt(e.target.value))} className="flex-1" />
                                        <button onClick={() => setMarginSize(f => Math.min(40, f+5))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="plus" size={16} /></button>
                                    </div>
                                </div>

                                {/* 4. 字體大小 */}
                                <div className="space-y-3">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>字體大小</span><span className="text-blue-500 text-base">{fontSize} pt</span></div>
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-slate-700 p-3 rounded-2xl">
                                        <button onClick={() => setFontSize(f => Math.max(12, f-1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="minus" size={16} /></button>
                                        <input type="range" min="12" max="42" value={fontSize} onChange={e => setFontSize(parseInt(e.target.value))} className="flex-1" />
                                        <button onClick={() => setFontSize(f => Math.min(42, f+1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="plus" size={16} /></button>
                                    </div>
                                </div>

                                {/* 5. 閱讀主題 */}
                                <div className="space-y-2">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>閱讀主題</span></div>
                                    <div className="grid grid-cols-4 gap-3">
                                        {['light', 'sepia', 'grey', 'dark'].map(t => (
                                            <button key={t} onClick={() => setTheme(t)} className={`h-12 rounded-xl border-2 transition-all ${theme === t ? 'border-blue-500 scale-105 shadow-md' : 'border-transparent opacity-60'} ${t === 'light' ? 'bg-white' : t === 'sepia' ? 'bg-[#f4ecd8]' : t === 'grey' ? 'bg-zinc-700' : 'bg-slate-900'}`} />
                                        ))}
                                    </div>
                                </div>

                                {/* 6. 字體選擇 */}
                                <div className="space-y-2">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>字體選擇</span></div>
                                    <div className="grid grid-cols-3 gap-2 bg-gray-50 dark:bg-slate-700 p-1.5 rounded-2xl">
                                        <button onClick={() => setFontFamily('sans')} className={`py-2.5 text-sm rounded-xl transition-all font-sans-tc ${fontFamily === 'sans' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>黑體</button>
                                        <button onClick={() => setFontFamily('serif')} className={`py-2.5 text-sm rounded-xl transition-all font-serif-tc ${fontFamily === 'serif' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>明體</button>
                                        <button onClick={() => setFontFamily('kai')} className={`py-2.5 text-sm rounded-xl transition-all font-kai-tc ${fontFamily === 'kai' ? 'bg-white dark:bg-slate-600 shadow-md font-bold text-blue-500' : 'opacity-60 text-slate-600 dark:text-slate-300'}`}>楷體</button>
                                    </div>
                                </div>
                                
                                {/* 7. API Key 安全設定 */}
                                <div className="space-y-2 pt-4 border-t dark:border-slate-700">
                                    <div className="flex justify-between font-bold opacity-60 text-xs tracking-wider px-1"><span>Gemini API Key (安全儲存於本地)</span></div>
                                    <div className="flex gap-2">
                                        <input 
                                            type="password" 
                                            value={tempApiKey} 
                                            onChange={e => setTempApiKey(e.target.value)} 
                                            placeholder="輸入您的 API 金鑰" 
                                            className="flex-1 bg-gray-50 dark:bg-slate-700 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white"
                                        />
                                        <button onClick={() => { setGeminiApiKey(tempApiKey); alert("API Key 已更新！"); }} className="px-4 py-2 bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-400 rounded-xl text-xs font-bold active:scale-95 transition-transform">儲存</button>
                                        <button onClick={() => { setGeminiApiKey(""); setTempApiKey(""); }} className="px-4 py-2 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 rounded-xl text-xs font-bold active:scale-95 transition-transform">清除</button>
                                    </div>
                                </div>

                                {/* 8. 完成設定 */}
                                <button onClick={() => setIsSettingsOpen(false)} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-xl active:scale-95 transition-all mt-4">完成設定</button>
                            </div>
                            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-[2px] -z-10" onClick={() => setIsSettingsOpen(false)} />
                        </div>
                    )}

                    {/* 載入遮罩 */}
                    {isLoading && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black bg-opacity-70 text-white backdrop-blur-md p-10 text-center">
                            <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-6 shadow-2xl"></div>
                            <p className="font-bold text-lg mb-2 tracking-widest">{loadingMsg}</p>
                            {ocrProgress > 0 && (
                                <div className="w-full max-w-xs bg-gray-700 rounded-full h-2.5 mb-2 overflow-hidden mx-auto">
                                    <div className="bg-blue-500 h-full progress-bar" style={{ width: `${ocrProgress}%` }}></div>
                                </div>
                            )}
                            <p className="text-xs opacity-50 mt-2">處理中，請稍候片刻</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

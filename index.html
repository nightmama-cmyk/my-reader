<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲端閱讀器 (全格式+AI版)</title>
    <!-- 引入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap');
        body { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
        .content-area { line-height: 1.85; letter-spacing: 0.03em; word-break: break-all; user-select: text; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type=range] { accent-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .progress-bar { transition: width 0.4s ease-in-out; }
        .ai-bubble { position: relative; border-radius: 1.5rem; border-bottom-left-radius: 0.25rem; }
        .ai-bubble-user { border-radius: 1.5rem; border-bottom-right-radius: 0.25rem; }
        .icon-wrapper { display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

      // --- Gemini API 設定 ---
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        function getApiKey() {
            let key = localStorage.getItem('ai_reader_api_key_v1');
            if (!key) {
                key = window.prompt("歡迎使用雲端閱讀器！\n請輸入您的 Gemini API Key：\n(此 Key 只會安全地儲存於您目前的裝置中，不會上傳至伺服器)");
                if (key && key.trim() !== "") {
                    localStorage.setItem('ai_reader_api_key_v1', key.trim());
                }
            }
            return key;
        }

        async function fetchGemini(promptText, systemInstruction = "") {
            const apiKey = getApiKey();
            if (!apiKey) return "系統提示：您必須輸入 API Key 才能使用 AI 功能。請重新整理網頁並輸入。";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        if (response.status === 400 || response.status === 403) {
                            localStorage.removeItem('ai_reader_api_key_v1');
                            throw new Error("API Key 可能無效或錯誤，請重新整理網頁重新輸入。");
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，目前無法生成內容。";
                } catch (error) {
                    if (i === 4) return error.message;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }
        // 解決 removeChild 衝突的 Icon 組件
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    if (className) i.className = className;
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    containerRef.current.innerHTML = '';
                    containerRef.current.appendChild(i);
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="icon-wrapper" style={{ width: size, height: size }}></span>;
        };

        const App = () => {
            // --- 狀態定義 ---
            const [books, setBooks] = useState([]);
            const [currentBookId, setCurrentBookId] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isAIOpen, setIsAIOpen] = useState(false);
            
            const [theme, setTheme] = useState('light');
            const [fontSize, setFontSize] = useState(20);
            const [fontFamily, setFontFamily] = useState('serif');
            const [isSimplified, setIsSimplified] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState("");
            const [ocrProgress, setOcrProgress] = useState(0);
            const [ocrLang, setOcrLang] = useState('eng');

            const [chatHistory, setChatHistory] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isAILoading, setIsAILoading] = useState(false);

            // --- 初始化 ---
            useEffect(() => {
                const savedBooks = localStorage.getItem('ai_reader_library_v7');
                const savedSettings = localStorage.getItem('ai_reader_settings_v7');
                if (savedBooks) {
                    try { setBooks(JSON.parse(savedBooks)); } catch(e) {}
                }
                if (savedSettings) {
                    try {
                        const s = JSON.parse(savedSettings);
                        if (s.theme) setTheme(s.theme);
                        if (s.fontSize) setFontSize(s.fontSize);
                        if (s.isSimplified !== undefined) setIsSimplified(s.isSimplified);
                        if (s.currentBookId) setCurrentBookId(s.currentBookId);
                    } catch(e) {}
                }
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }, []);

            useEffect(() => {
                localStorage.setItem('ai_reader_settings_v7', JSON.stringify({ theme, fontSize, fontFamily, isSimplified, ocrLang, currentBookId }));
            }, [theme, fontSize, fontFamily, isSimplified, ocrLang, currentBookId]);

            useEffect(() => {
                localStorage.setItem('ai_reader_library_v7', JSON.stringify(books));
            }, [books]);

            const currentBook = useMemo(() => books.find(b => b.id === currentBookId), [books, currentBookId]);

            // --- 文字處理 ---
            const displayContent = useMemo(() => {
                if (!currentBook) return "";
                if (!isSimplified || !window.OpenCC) return currentBook.content;
                try {
                    const converter = window.OpenCC.Converter({ from: 'hk', to: 'cn' });
                    return converter(currentBook.content);
                } catch (e) { return currentBook.content; }
            }, [currentBook, isSimplified]);

            const displayTitle = useMemo(() => {
                if (!currentBook) return "";
                if (!isSimplified || !window.OpenCC) return currentBook.title;
                try {
                    const converter = window.OpenCC.Converter({ from: 'hk', to: 'cn' });
                    return converter(currentBook.title);
                } catch (e) { return currentBook.title; }
            }, [currentBook, isSimplified]);

            // --- 功能函數 ---
            const handleScroll = (e) => {
                if (!currentBookId) return;
                const { scrollTop, scrollHeight, clientHeight } = e.currentTarget;
                if (scrollHeight <= clientHeight) return;
                const prog = (scrollTop / (scrollHeight - clientHeight)) * 100;
                setBooks(prev => prev.map(b => b.id === currentBookId ? { ...b, progress: prog } : b));
            };

            const handleAISummary = async () => {
                if (!currentBook) return;
                setIsAILoading(true);
                setChatHistory(prev => [...prev, { role: "user", text: "請總結此書目前的內容。" }]);
                try {
                    const prompt = `書籍標題：${currentBook.title}\n內容摘要：${currentBook.content.substring(0, 10000)}\n\n請生成精煉大綱。`;
                    const res = await fetchGemini(prompt, "你是一位文學助手。請用繁體中文回答。");
                    setChatHistory(prev => [...prev, { role: "ai", text: res }]);
                } catch (e) { setChatHistory(prev => [...prev, { role: "ai", text: "AI 連線中斷。" }]); }
                setIsAILoading(false);
            };

            const handleAskAI = async () => {
                if (!userInput.trim() || !currentBook) return;
                const q = userInput; setUserInput("");
                setChatHistory(prev => [...prev, { role: "user", text: q }]);
                setIsAILoading(true);
                try {
                    const prompt = `當前閱讀：${currentBook.title}\n上下文：${currentBook.content.substring(0, 15000)}\n\n問題：${q}`;
                    const res = await fetchGemini(prompt, "你是一位導師，請根據內容解惑，使用繁體中文。");
                    setChatHistory(prev => [...prev, { role: "ai", text: res }]);
                } catch (e) { setChatHistory(prev => [...prev, { role: "ai", text: "系統錯誤。" }]); }
                setIsAILoading(false);
            };

            // --- 檔案導入核心 ---
            const handleFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                setOcrProgress(0);
                setLoadingMsg("正在解析檔案格式...");

                try {
                    const fileName = file.name.toLowerCase();
                    if (fileName.endsWith('.txt')) {
                        const r = new FileReader();
                        r.onload = (ev) => importBook(file.name, ev.target.result);
                        r.readAsText(file);
                    } else if (fileName.endsWith('.docx')) {
                        const r = new FileReader();
                        r.onload = async (ev) => {
                            const res = await window.mammoth.extractRawText({ arrayBuffer: ev.target.result });
                            importBook(file.name, res.value);
                        };
                        r.readAsArrayBuffer(file);
                    } else if (fileName.endsWith('.epub')) {
                        const zip = await JSZip.loadAsync(file);
                        let epubText = "";
                        const files = Object.keys(zip.files);
                        for (let fName of files) {
                            if (fName.endsWith('.html') || fName.endsWith('.xhtml')) {
                                const content = await zip.file(fName).async("string");
                                const doc = new DOMParser().parseFromString(content, 'text/html');
                                epubText += doc.body.innerText + "\n\n";
                            }
                        }
                        importBook(file.name, epubText);
                    } else if (fileName.endsWith('.pdf')) {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = "";
                        let hasTextLayer = 0;

                        setLoadingMsg("探測 PDF 文字層...");
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const tc = await page.getTextContent();
                            const pt = tc.items.map(it => it.str).join(" ");
                            if (pt.trim().length > 15) hasTextLayer++;
                            fullText += pt + "\n";
                            if (i % 10 === 0) setOcrProgress(Math.round((i / pdf.numPages) * 100));
                        }

                        if (hasTextLayer < Math.min(pdf.numPages, 2)) {
                            if (confirm(`偵測到圖片型 PDF。是否啟動 OCR 辨識？\n(語言: ${ocrLang === 'eng' ? '英文' : '繁中'})`)) {
                                await runOCR(pdf, file.name, ocrLang);
                            } else { importBook(file.name, ""); }
                        } else {
                            importBook(file.name, fullText);
                        }
                    } else {
                        alert("不支援此格式，建議轉為 EPUB 或 PDF 再導入。");
                        setIsLoading(false);
                    }
                } catch (err) { alert("讀取失敗：" + err.message); setIsLoading(false); }
            };

            const runOCR = async (pdf, title, lang) => {
                setLoadingMsg("初始化 OCR 引擎...");
                const worker = await Tesseract.createWorker(lang);
                let result = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    setOcrProgress(Math.round((i / pdf.numPages) * 100));
                    setLoadingMsg(`正在辨識第 ${i}/${pdf.numPages} 頁...`);
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    const { data: { text } } = await worker.recognize(canvas);
                    result += text + "\n";
                }
                await worker.terminate();
                importBook(title, result);
            };

            const importBook = (title, content) => {
                const nb = { id: Date.now().toString(), title: title.replace(/\.[^/.]+$/, ""), content: content || "（內容讀取失敗）", progress: 0 };
                setBooks(prev => [nb, ...prev]);
                setCurrentBookId(nb.id);
                setIsMenuOpen(false);
                setIsLoading(false);
            };

            // --- 介面配色 ---
            const themes = {
                light: 'bg-white text-slate-800',
                dark: 'bg-slate-900 text-slate-300',
                sepia: 'bg-[#f4ecd8] text-[#5b4636]',
                grey: 'bg-zinc-800 text-zinc-300'
            };

            return (
                <div className={`flex flex-col h-screen transition-colors duration-300 ${themes[theme]}`}>
                    {/* 頂部欄 */}
                    <header className={`flex items-center justify-between px-4 py-3 border-b border-opacity-10 border-current shadow-sm z-30 ${themes[theme]}`}>
                        <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-gray-500 hover:bg-opacity-10 rounded-full flex items-center justify-center transition-all">
                            <Icon name="menu" size={24} />
                        </button>
                        <h1 className="font-bold text-base truncate flex-1 px-2 text-center">
                            {currentBook ? displayTitle : '雲端閱讀器'}
                        </h1>
                        <div className="flex gap-1 items-center">
                            <button onClick={() => setIsAIOpen(true)} className="p-2 text-blue-500 active:scale-90 transition-all flex items-center justify-center">
                                <Icon name="sparkles" size={24} />
                            </button>
                            <button onClick={() => setIsSettingsOpen(true)} className="p-2 hover:bg-gray-500 hover:bg-opacity-10 rounded-full flex items-center justify-center transition-all">
                                <Icon name="settings" size={24} />
                            </button>
                        </div>
                    </header>

                    {/* 內容區 */}
                    <main onScroll={handleScroll} className="flex-1 overflow-y-auto px-6 py-6 md:px-32 lg:px-64 no-scrollbar scroll-smooth"
                        style={{ fontSize: `${fontSize}pt`, fontFamily: fontFamily === 'serif' ? '"Noto Serif TC", serif' : '"Noto Sans TC", sans-serif' }}>
                        {currentBook ? (
                            <div className="content-area whitespace-pre-wrap fade-in">
                                <h2 className="text-2xl font-bold mb-8 opacity-80 border-b border-current border-opacity-10 pb-4">{displayTitle}</h2>
                                {displayContent}
                                <div className="h-48" />
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-full opacity-30 text-center px-10">
                                <Icon name="book-open" size={80} className="mb-4" />
                                <p className="text-lg font-bold tracking-widest">導入您的電子書</p>
                                <p className="text-xs mt-2 italic">支援 EPUB, PDF, DOCX, TXT</p>
                            </div>
                        )}
                    </main>

                    {currentBook && (
                        <div className="h-1.5 w-full bg-gray-500 bg-opacity-10 fixed bottom-0 z-40">
                            <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${currentBook.progress}%` }} />
                        </div>
                    )}

                    {/* 書庫側欄 */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div className="bg-white dark:bg-slate-800 w-80 h-full shadow-2xl flex flex-col animate-in slide-in-from-left duration-300">
                                <div className="p-5 bg-blue-600 text-white flex justify-between items-center">
                                    <span className="font-bold flex items-center gap-2"><Icon name="library" size={20} /> 我的書庫</span>
                                    <button onClick={() => setIsMenuOpen(false)}><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-4 border-b dark:border-slate-700">
                                    <div className="mb-3 flex gap-2">
                                        <button onClick={() => setOcrLang('eng')} className={`flex-1 py-1 text-[10px] rounded-md border ${ocrLang === 'eng' ? 'bg-blue-500 text-white border-blue-500' : 'text-slate-400 border-slate-300'}`}>OCR: 英文</button>
                                        <button onClick={() => setOcrLang('chi_tra')} className={`flex-1 py-1 text-[10px] rounded-md border ${ocrLang === 'chi_tra' ? 'bg-blue-500 text-white border-blue-500' : 'text-slate-400 border-slate-300'}`}>OCR: 繁中</button>
                                    </div>
                                    <label className="flex flex-col items-center justify-center p-5 border-2 border-dashed border-blue-200 dark:border-slate-600 rounded-2xl cursor-pointer hover:bg-blue-50 dark:hover:bg-slate-700 transition-all text-blue-500 group">
                                        <Icon name="plus-circle" size={32} className="group-active:scale-95" />
                                        <span className="mt-2 text-sm font-bold">導入新書 (EPUB/PDF)</span>
                                        <input type="file" className="hidden" accept=".txt,.docx,.pdf,.epub" onChange={handleFile} />
                                    </label>
                                </div>
                                <div className="flex-1 overflow-y-auto py-2 no-scrollbar">
                                    {books.map(b => (
                                        <div key={b.id} onClick={() => {setCurrentBookId(b.id); setIsMenuOpen(false);}}
                                            className={`px-4 py-4 border-b dark:border-slate-700 flex justify-between items-center active:bg-blue-50 transition-colors ${currentBookId === b.id ? 'bg-blue-50 dark:bg-slate-700 text-blue-600 font-bold' : 'text-slate-600 dark:text-slate-400'}`}>
                                            <div className="flex-1 min-w-0 pr-2">
                                                <p className="truncate text-sm">{b.title}</p>
                                                <p className="text-[10px] opacity-50 mt-1">已讀 {Math.round(b.progress)}%</p>
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); setBooks(books.filter(x=>x.id!==b.id)); }} className="text-red-400 p-2">
                                                <Icon name="trash-2" size={18} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex-1 bg-black bg-opacity-40 backdrop-blur-sm" onClick={() => setIsMenuOpen(false)} />
                        </div>
                    )}

                    {/* ✨ AI 助手 */}
                    {isAIOpen && (
                        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 w-full max-lg h-[80vh] rounded-3xl shadow-2xl flex flex-col animate-in slide-in-from-bottom duration-300 overflow-hidden">
                                <div className="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-gradient-to-r from-blue-500 to-indigo-600 text-white">
                                    <h3 className="font-bold flex items-center gap-2"><Icon name="sparkles" size={20} /> ✨ AI 助手</h3>
                                    <button onClick={() => setIsAIOpen(false)} className="p-1 hover:bg-white hover:bg-opacity-20 rounded-full flex items-center justify-center"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-slate-50 dark:bg-slate-900">
                                    {chatHistory.length === 0 && (
                                        <div className="flex flex-col items-center justify-center h-full opacity-40 text-center px-4">
                                            <Icon name="message-square" size={48} className="mb-4 text-blue-500" />
                                            <p className="text-sm font-bold">詢問關於這本書的任何問題</p>
                                            <div className="mt-6 grid grid-cols-2 gap-2 w-full">
                                                <button onClick={handleAISummary} className="p-3 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl text-xs font-bold text-blue-600 flex flex-col items-center gap-1 active:scale-95 transition-all">
                                                    <Icon name="file-text" size={16} /> 內容總結
                                                </button>
                                                <button onClick={() => setUserInput("列出書中的重點人物與知識點。")} className="p-3 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl text-xs font-bold text-blue-600 flex flex-col items-center gap-1 active:scale-95 transition-all">
                                                    <Icon name="list" size={16} /> 重點提取
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                    {chatHistory.map((chat, i) => (
                                        <div key={i} className={`flex ${chat.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] px-4 py-3 shadow-sm ${chat.role === 'user' ? 'bg-blue-600 text-white ai-bubble-user' : 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 ai-bubble'}`}>
                                                <p className="text-sm whitespace-pre-wrap leading-relaxed font-sans">{chat.text}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {isAILoading && (
                                        <div className="flex justify-start">
                                            <div className="bg-white dark:bg-slate-700 px-4 py-3 rounded-2xl animate-pulse flex items-center gap-2">
                                                <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
                                                <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style={{animationDelay:'150ms'}}></div>
                                                <div className="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style={{animationDelay:'300ms'}}></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 border-t dark:border-slate-700 flex gap-2 items-center bg-white dark:bg-slate-800">
                                    <input type="text" value={userInput} onChange={(e) => setUserInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleAskAI()} placeholder="✨ 詢問 AI..." className="flex-1 bg-gray-100 dark:bg-slate-700 border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white" />
                                    <button onClick={handleAskAI} disabled={isAILoading || !userInput.trim()} className="w-12 h-12 flex items-center justify-center bg-blue-600 text-white rounded-full shadow-lg disabled:opacity-50"><Icon name="send" size={18} /></button>
                                </div>
                            </div>
                            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-[2px] -z-10" onClick={() => setIsAIOpen(false)} />
                        </div>
                    )}

                    {/* 設定面版 */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-6 animate-in slide-in-from-bottom sm:zoom-in duration-200">
                                <div className="flex justify-between items-center border-b pb-3 dark:border-slate-700">
                                    <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="settings" size={20} /> 閱讀偏好</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="p-1 bg-gray-100 dark:bg-slate-700 rounded-full flex items-center justify-center"><Icon name="x" size={20} /></button>
                                </div>
                                <div className="flex justify-between items-center bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl">
                                    <span className="font-bold flex items-center gap-2 text-sm"><Icon name="languages" size={20} className="text-blue-500" /> 顯示簡體中文</span>
                                    <button onClick={() => setIsSimplified(!isSimplified)} className={`w-14 h-8 rounded-full transition-all relative ${isSimplified ? 'bg-blue-500' : 'bg-gray-300 dark:bg-slate-600'}`}>
                                        <div className={`absolute top-1 w-6 h-6 bg-white rounded-full shadow-md transition-all ${isSimplified ? 'right-1' : 'left-1'}`} />
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between font-bold opacity-60 text-xs"><span>字體大小</span><span className="text-blue-500 text-lg">{fontSize} pt</span></div>
                                    <div className="flex items-center gap-4 bg-gray-50 dark:bg-slate-700 p-3 rounded-2xl">
                                        <button onClick={() => setFontSize(f => Math.max(12, f-1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="minus" size={16} /></button>
                                        <input type="range" min="12" max="42" value={fontSize} onChange={e => setFontSize(parseInt(e.target.value))} className="flex-1" />
                                        <button onClick={() => setFontSize(f => Math.min(42, f+1))} className="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-600 rounded-xl shadow-sm active:scale-90 transition-all"><Icon name="plus" size={16} /></button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 gap-3">
                                    {['light', 'sepia', 'grey', 'dark'].map(t => (
                                        <button key={t} onClick={() => setTheme(t)} className={`h-12 rounded-xl border-2 transition-all ${theme === t ? 'border-blue-500 scale-105 shadow-md' : 'border-transparent opacity-60'} ${t === 'light' ? 'bg-white' : t === 'sepia' ? 'bg-[#f4ecd8]' : t === 'grey' ? 'bg-zinc-700' : 'bg-slate-900'}`} />
                                    ))}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setFontFamily('sans')} className={`flex-1 py-3 rounded-xl border-2 font-bold text-sm ${fontFamily === 'sans' ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-gray-100 dark:border-slate-700'}`}>黑體</button>
                                    <button onClick={() => setFontFamily('serif')} className={`flex-1 py-3 rounded-xl border-2 font-serif font-bold text-sm ${fontFamily === 'serif' ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-gray-100 dark:border-slate-700'}`}>明體</button>
                                </div>
                                <button 
    onClick={() => {
        const newKey = window.prompt("請輸入新的 Gemini API Key：", localStorage.getItem('ai_reader_api_key_v1') || "");
        if (newKey) {
            localStorage.setItem('ai_reader_api_key_v1', newKey.trim());
            alert("API Key 已更新！");
        }
    }} 
    className="w-full py-3 mb-3 bg-gray-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl font-bold shadow-sm active:scale-95 transition-all text-sm">
    <Icon name="key" size={16} className="inline mr-2" /> 更新 API Key
</button>
                            </div>
                            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-[2px] -z-10" onClick={() => setIsSettingsOpen(false)} />
                        </div>
                    )}

                    {/* 載入遮罩 */}
                    {isLoading && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black bg-opacity-70 text-white backdrop-blur-md p-10 text-center">
                            <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-6 shadow-2xl"></div>
                            <p className="font-bold text-lg mb-2">{loadingMsg}</p>
                            {ocrProgress > 0 && (
                                <div className="w-full max-w-xs bg-gray-700 rounded-full h-2.5 mb-2 overflow-hidden mx-auto">
                                    <div className="bg-blue-500 h-full progress-bar" style={{ width: `${ocrProgress}%` }}></div>
                                </div>
                            )}
                            <p className="text-xs opacity-50">處理中，請稍候</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
